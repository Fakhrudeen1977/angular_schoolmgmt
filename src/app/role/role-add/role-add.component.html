
<mat-card class="mat-class-card" color="accent"> 
  
  <mat-card-header>
    <mat-card-title class=" mat-class-title" >Roles</mat-card-title>
  </mat-card-header>  
     
 <mat-card-content >
    <form [formGroup]="roleFrm">
   
      <mat-form-field class="form-field">
        <mat-label> RoleName
        </mat-label>
        <input matInput formControlName="roleName" type="text">
        <mat-error *ngIf="roleName?.hasError('required')">
              RoleName is required.
        </mat-error>  
          <mat-error *ngIf="roleName?.hasError('minlength')">
           RoleName must be at least 2 characters long
        </mat-error>  

          <mat-error *ngIf="roleName?.hasError('maxlength')">
           RoleName can be max 30 characters long
        </mat-error>  
      
        
    

      </mat-form-field>           
    
      <mat-card-actions>
      
       <button type="submit" class="mat-class-button"  mat-raised-button color="primary"[disabled]="!roleFrm.valid" (click)="saveRole()" >Save</button>
       
      </mat-card-actions>
    </form>

 </mat-card-content>
 
</mat-card>
